<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encomendar — Ateliê</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

  <a href="index.html" class="home-btn" aria-label="Voltar ao início" title="Início">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11.5 12 4l9 7.5"/>
      <path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/>
    </svg>
  </a>

  <main class="page">
    <div class="page-head">
      <p class="eyebrow">Encomenda</p>
      <h2 class="page-title" id="titulo-produto">Encomendar peça</h2>
      <p class="page-lede">Preencha seus dados. Seu pedido cai direto na minha caixa de entrada e eu retorno o combinado por email ou whatsapp.</p>
    </div>

    <div class="product">
      <div>
        <div class="gallery-main" id="foto-encomenda">
          <img id="produto-imagem" src="" alt="Foto da peça escolhida" draggable="false" ondragstart="return false;">
        </div>
        <div class="zoom-hint">clique na foto pra ampliar</div>
        <p class="price" id="produto-preco" style="margin-top:16px;"></p>
      </div>

      <!--
        IMPORTANTE: os dois formulários (encomenda e cadastro) já estão
        ligados ao Formspree. Se quiser trocar o email de destino no futuro,
        é só criar um novo formulário em formspree.io e trocar o link do
        "action" abaixo.
      -->
      <form class="form-card" id="form-encomenda" action="https://formspree.io/f/mnjekvkr" method="POST">
        <input type="hidden" name="Item_desejado" id="produto-hidden" value="">
        <input type="hidden" name="Preço" id="preco-hidden" value="">
        <input type="hidden" name="Foto_do_item" id="imagem-hidden" value="">
        <input type="hidden" name="_subject" id="subject-hidden" value="Nova encomenda pelo site">

        <div class="field">
          <label for="produto-label">Peça desejada</label>
          <input type="text" id="produto-label" readonly>
        </div>

        <div class="field">
          <label for="nome">Seu nome</label>
          <input type="text" id="nome" name="Nome" placeholder="Nome completo" required>
        </div>

        <div class="field">
          <label for="email">Seu email</label>
          <input type="email" id="email" name="Email" placeholder="voce@exemplo.com" required>
        </div>

        <div class="field">
          <label for="celular">Seu celular / WhatsApp</label>
          <input type="tel" id="celular" name="Celular" placeholder="(00) 00000-0000" required>
        </div>

        <button type="submit" class="btn">Enviar encomenda</button>
        <div class="form-success" id="success-msg">Encomenda enviada! Você recebe uma resposta minha em breve.</div>
      </form>
    </div>
  </main>

  <footer>
    <span>Ateliê — peças autorais</span>
    <span>feito à mão, uma de cada vez</span>
  </footer>

  <script src="js/gallery.js?v=3"></script>
  <script>
    // pega os dados da peça pela URL (produto, imagem, preco)
    const params = new URLSearchParams(window.location.search);
    const produto = params.get('produto') || 'Peça personalizada';
    const imagemRelativa = params.get('imagem') || '';
    const preco = params.get('preco') || '';

    // monta o endereço completo da foto, pra ela aparecer certinho no seu email
    const imagemAbsoluta = imagemRelativa ? new URL(imagemRelativa, window.location.href).href : '';

    document.getElementById('titulo-produto').textContent = 'Encomendar: ' + produto;
    document.getElementById('produto-hidden').value = produto;
    document.getElementById('produto-label').value = produto;
    document.getElementById('preco-hidden').value = preco;
    document.getElementById('imagem-hidden').value = imagemAbsoluta;
    // assunto do email já vem com o nome do item, pra você bater o olho e saber do que se trata
    document.getElementById('subject-hidden').value = 'Nova encomenda: ' + produto;
    document.getElementById('produto-preco').textContent = preco;

    const fotoImg = document.getElementById('produto-imagem');
    if (imagemRelativa) {
      fotoImg.src = imagemRelativa;
      fotoImg.addEventListener('click', () => openZoom(fotoImg.src));
      document.getElementById('foto-encomenda').style.cursor = 'zoom-in';
    } else {
      document.getElementById('foto-encomenda').style.display = 'none';
      document.querySelector('.zoom-hint').style.display = 'none';
    }

    const form = document.getElementById('form-encomenda');
    const success = document.getElementById('success-msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = new FormData(form);
      try {
        const res = await fetch(form.action, { method: 'POST', body: data, headers: { 'Accept': 'application/json' } });
        if (res.ok) {
          success.classList.add('show');
          form.reset();
          document.getElementById('produto-label').value = produto;
          document.getElementById('produto-hidden').value = produto;
          document.getElementById('preco-hidden').value = preco;
          document.getElementById('imagem-hidden').value = imagemAbsoluta;
          document.getElementById('subject-hidden').value = 'Nova encomenda: ' + produto;
        } else {
          alert('Não consegui enviar agora. Tenta de novo em instantes.');
        }
      } catch (err) {
        alert('Não consegui enviar agora. Verifique sua internet e tente de novo.');
      }
    });
  </script>
</body>
</html>
