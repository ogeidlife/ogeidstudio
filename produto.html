<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peça — Ateliê</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3">
<style>
  .variacoes{ margin:0 0 28px; }
  .variacao-grupo{ margin-bottom:18px; }
  .variacao-grupo:last-child{ margin-bottom:0; }
  .variacao-nome{
    font-family:var(--f-mono); font-size:11px; color:var(--ink-dim);
    text-transform:uppercase; letter-spacing:.08em; margin:0 0 10px;
  }
  .variacao-opcoes{ display:flex; flex-wrap:wrap; gap:8px; }
  .variacao-chip{
    all:unset; cursor:pointer; font-family:var(--f-body); font-size:13px;
    color:var(--ink); border:1px solid var(--line); padding:9px 16px;
    border-radius:var(--radius); transition:border-color .15s ease, background .15s ease;
  }
  .variacao-chip:hover{ border-color:var(--accent); }
  .variacao-chip.selected{
    border-color:var(--accent); background:var(--accent); color:var(--bg);
  }
</style>
</head>
<body>

  <a href="catalogo.html" class="back-btn home-btn" aria-label="Voltar" title="Voltar"
     onclick="if (window.history.length > 1) { history.back(); return false; }">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 6l-6 6 6 6"/>
    </svg>
  </a>

  <a href="index.html" class="home-btn" aria-label="Voltar ao início" title="Início">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11.5 12 4l9 7.5"/>
      <path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/>
    </svg>
  </a>

  <main class="page">
    <div class="product">
      <div class="gallery">
        <div class="gallery-main">
          <img id="img-principal" src="" alt="Foto da peça" draggable="false" ondragstart="return false;">
        </div>
        <div class="gallery-thumbs" id="miniaturas"></div>
        <div class="zoom-hint">deslize pra ver mais · toque pra ampliar</div>
      </div>
      <div class="product-info">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="titulo"></h1>
        <p class="price" id="preco"></p>
        <p class="desc" id="descricao"></p>

        <ul class="spec-list" id="specs"></ul>

        <div class="variacoes" id="variacoes"></div>

        <a href="encomenda.html" id="btn-encomendar" class="btn">Encomendar esta peça</a>
      </div>
    </div>
  </main>

  <footer>
    <span>Ateliê — peças autorais</span>
    <span><a href="catalogo.html">voltar ao catálogo</a></span>
  </footer>

  <script src="js/gallery.js?v=3"></script>
  <script src="js/produto.js?v=2"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/visitas.js" defer></script>
</body>
</html>
