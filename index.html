<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ateliê — Colecionáveis Autorais</title>
<meta name="description" content="Colecionáveis autorais impresso em 3D e pintados à mão: cabeças de personagem, quadros, abajures, prints e livros.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3">
<link rel="stylesheet" href="css/colecao.css?v=1">
</head>
<body>

  <!-- Na home fica a vitrine da coleção (carrossel de pinturas) e as duas abas, sem mais nada no topo -->
  <div class="topbar">
    <span class="brand-mark">COLEÇÃO · universo ogeid</span>
    <nav class="nav-pill">
      <a href="catalogo.html">Catálogo</a>
      <a href="cadastro.html">Cadastro</a>
    </nav>
  </div>

  <!-- A vitrine em si é montada pelo js/colecao-carrossel.js, a partir de
       data/produtos.json + data/carrossel.json (o que aparece aqui e a
       ordem/velocidade são configurados no painel admin, aba "Coleção"). -->
  <section class="hero colecao-hero" id="colecao-hero" aria-roledescription="carrossel" aria-label="Vitrine da coleção de pinturas">
    <p class="eyebrow colecao-eyebrow">Coleção</p>

    <div class="colecao-stage" id="colecao-stage" tabindex="0"
         role="listbox" aria-label="Pinturas da coleção — use as setas do teclado ou deslize para navegar">
      <p class="colecao-loading" id="colecao-loading">carregando coleção…</p>
    </div>

    <button type="button" class="colecao-seta colecao-prev" id="colecao-prev" aria-label="Pintura anterior">‹</button>
    <button type="button" class="colecao-seta colecao-next" id="colecao-next" aria-label="Próxima pintura">›</button>

    <div class="hero-caption">
      <h1 id="colecao-titulo-atual">Ogeid</h1>
      <p id="colecao-cta">clique na pintura para conhecer a obra</p>
    </div>
  </section>

  <script src="js/colecao-carrossel.js?v=1" defer></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/visitas.js" defer></script>
</body>
</html>
