<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Finalizar pedido — Ateliê</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3">
<style>
  .pedido-grid{ margin:18px 0 22px; border-top:1px solid var(--line); }
  .pedido-grid-row{
    display:flex; justify-content:space-between; align-items:baseline; gap:20px;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .pedido-grid-row .rotulo{
    font-family:var(--f-mono); font-size:11px; color:var(--ink-dim);
    text-transform:uppercase; letter-spacing:.06em; white-space:nowrap;
  }
  .pedido-grid-row .valor{ text-align:right; font-size:14px; }
  .pedido-grid-row.full .valor{ text-align:left; width:100%; }

  .pedido-pagamento{
    display:flex; flex-wrap:wrap; align-items:center; gap:20px; margin-top:22px;
  }
  .pedido-qr-wrap{ flex-shrink:0; text-align:center; }
  .pedido-qr-wrap img{
    width:150px; height:150px; object-fit:contain; border:1px solid var(--line);
    background:#fff; padding:8px;
  }
  .pedido-qr-caption{
    font-family:var(--f-mono); font-size:10px; color:var(--ink-dim);
    text-transform:uppercase; letter-spacing:.08em; margin-top:8px;
  }
  .pedido-cta{ flex:1; min-width:180px; }
  .pedido-cta .btn{ display:inline-block; width:100%; text-align:center; }

  .pedido-pago-box{
    border:1px solid var(--accent-2); color:var(--accent-2); padding:16px 18px;
    font-family:var(--f-mono); font-size:13px; margin-top:22px;
  }
  .pedido-erro{ color:var(--ink-dim); font-size:14px; line-height:1.7; max-width:60ch; }
  .pedido-loading{ color:var(--ink-dim); font-family:var(--f-mono); font-size:12px; }

  /* sem imagem: a coluna de texto ocupa a página inteira, sem o vão da galeria vazia */
  .product.sem-imagem{ grid-template-columns:1fr; }
  .product.sem-imagem .gallery{ display:none; }
</style>
</head>
<body>

  <a href="index.html" class="home-btn" aria-label="Voltar ao início" title="Início">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11.5 12 4l9 7.5"/>
      <path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/>
    </svg>
  </a>

  <main class="page" id="pedido-conteudo">
    <p class="pedido-loading">Carregando pedido...</p>
  </main>

  <footer>
    <span>Ateliê — peças autorais</span>
    <span>feito à mão, uma de cada vez</span>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const conteudo = document.getElementById('pedido-conteudo');

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function mostrarErro() {
      conteudo.innerHTML = `
        <div class="page-head">
          <p class="eyebrow">Pedido não encontrado</p>
          <h2 class="page-title">Não encontramos esse pedido</h2>
          <p class="pedido-erro">O link pode estar incompleto ou ter mudado. Verifique se você copiou o link inteiro, ou me chama por email ou WhatsApp que eu te mando de novo.</p>
        </div>
      `;
    }

    async function carregarPedido() {
      if (!id) { mostrarErro(); return; }
      try {
        const res = await fetch('data/pedidos.json', { cache: 'no-store' });
        if (!res.ok) { mostrarErro(); return; }
        const pedidos = await res.json();
        const pedido = pedidos[id];
        if (!pedido) { mostrarErro(); return; }
        renderizarPedido(pedido);
      } catch (err) {
        mostrarErro();
      }
    }

    // transforma cada linha do resumo numa linha da grade — "Rótulo: valor"
    // vira duas colunas; uma linha sem ":" ocupa a linha inteira.
    function montarGrade(resumo) {
      const linhas = (resumo || '').split('\n').map((l) => l.trim()).filter(Boolean);
      if (!linhas.length) return '';
      const rows = linhas.map((linha) => {
        const i = linha.indexOf(':');
        if (i > -1 && i < linha.length - 1) {
          const rotulo = escapeHtml(linha.slice(0, i).trim());
          const valor = escapeHtml(linha.slice(i + 1).trim());
          return `<div class="pedido-grid-row"><span class="rotulo">${rotulo}</span><span class="valor">${valor}</span></div>`;
        }
        return `<div class="pedido-grid-row full"><span class="valor">${escapeHtml(linha)}</span></div>`;
      });
      return `<div class="pedido-grid">${rows.join('')}</div>`;
    }

    function renderizarPedido(pedido) {
      const saudacao = pedido.comprador ? `Olá, ${escapeHtml(pedido.comprador)}!` : 'Finalizar pedido';
      const temImagem = !!pedido.imagem;

      let qrHtml = '';
      if (pedido.qrcode && !pedido.pago) {
        qrHtml = `
          <div class="pedido-qr-wrap">
            <img src="${pedido.qrcode}" alt="QR code para pagamento" onerror="this.closest('.pedido-qr-wrap').style.display='none';">
            <p class="pedido-qr-caption">escaneie pra pagar</p>
          </div>
        `;
      }

      let pagamentoHtml = '';
      if (pedido.pago) {
        pagamentoHtml = `<div class="pedido-pago-box">Pagamento confirmado — obrigada pela encomenda! Qualquer novidade eu aviso por email ou WhatsApp.</div>`;
      } else if (pedido.linkPagamento) {
        pagamentoHtml = `
          <div class="pedido-pagamento">
            ${qrHtml}
            <div class="pedido-cta">
              <a href="${pedido.linkPagamento}" target="_blank" rel="noopener" class="btn">Ir para o pagamento</a>
            </div>
          </div>
        `;
      }

      conteudo.innerHTML = `
        <div class="product${temImagem ? '' : ' sem-imagem'}">
          <div class="gallery">
            <div class="gallery-main">
              <img src="${pedido.imagem || ''}" alt="Imagem da peça" draggable="false" ondragstart="return false;" onerror="this.closest('.product').classList.add('sem-imagem');">
            </div>
          </div>
          <div class="product-info">
            <p class="eyebrow">Finalizar pedido</p>
            <h1>${saudacao}</h1>
            ${pedido.valor ? `<p class="price">${escapeHtml(pedido.valor)}</p>` : ''}
            ${montarGrade(pedido.resumo)}
            ${pagamentoHtml}
          </div>
        </div>
      `;
    }

    carregarPedido();
  </script>
</body>
</html>
