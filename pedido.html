<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Finalizar pedido — Ateliê</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3">
<style>
  .pedido-resumo{
    white-space:pre-line; color:var(--ink-dim); font-size:14px; line-height:1.7;
    border:1px solid var(--line); padding:18px 20px; margin:20px 0;
  }
  .pedido-qr-wrap{ text-align:center; margin:28px 0; }
  .pedido-qr-wrap img{
    width:220px; height:220px; object-fit:contain; border:1px solid var(--line);
    background:#fff; padding:12px;
  }
  .pedido-qr-caption{
    font-family:var(--f-mono); font-size:11px; color:var(--ink-dim);
    text-transform:uppercase; letter-spacing:.08em; margin-top:10px;
  }
  .pedido-pago-box{
    border:1px solid var(--accent-2); color:var(--accent-2); padding:18px 20px;
    font-family:var(--f-mono); font-size:13px; margin-top:20px;
  }
  .pedido-erro{ color:var(--ink-dim); font-size:14px; line-height:1.7; }
</style>
</head>
<body>

  <a href="index.html" class="home-btn" aria-label="Voltar ao início" title="Início">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11.5 12 4l9 7.5"/>
      <path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/>
    </svg>
  </a>

  <main class="page" id="pedido-conteudo">
    <div class="page-head">
      <p class="eyebrow">Carregando...</p>
    </div>
  </main>

  <footer>
    <span>Ateliê — peças autorais</span>
    <span>feito à mão, uma de cada vez</span>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const conteudo = document.getElementById('pedido-conteudo');

    function formatarValor(valor) {
      return (valor || '').trim();
    }

    function mostrarErro() {
      conteudo.innerHTML = `
        <div class="page-head">
          <p class="eyebrow">Pedido não encontrado</p>
          <h2 class="page-title">Não encontramos esse pedido</h2>
          <p class="pedido-erro">O link pode estar incompleto ou ter mudado. Verifique se você copiou o link inteiro, ou fale comigo por email ou WhatsApp que eu te mando de novo.</p>
        </div>
      `;
    }

    async function carregarPedido() {
      if (!id) { mostrarErro(); return; }
      try {
        const res = await fetch('data/pedidos.json', { cache: 'no-store' });
        if (!res.ok) { mostrarErro(); return; }
        const pedidos = await res.json();
        const pedido = pedidos[id];
        if (!pedido) { mostrarErro(); return; }
        renderizarPedido(pedido);
      } catch (err) {
        mostrarErro();
      }
    }

    function renderizarPedido(pedido) {
      const saudacao = pedido.comprador ? `Olá, ${pedido.comprador}!` : 'Finalizar pedido';

      let qrHtml = '';
      if (pedido.qrcode) {
        qrHtml = `
          <div class="pedido-qr-wrap">
            <img src="${pedido.qrcode}" alt="QR code para pagamento" onerror="this.closest('.pedido-qr-wrap').style.display='none';">
            <p class="pedido-qr-caption">escaneie pra pagar</p>
          </div>
        `;
      }

      let acaoHtml = '';
      if (pedido.pago) {
        acaoHtml = `<div class="pedido-pago-box">Pagamento confirmado — obrigada pela encomenda! Qualquer novidade eu aviso por email ou WhatsApp.</div>`;
      } else if (pedido.linkPagamento) {
        acaoHtml = `<a href="${pedido.linkPagamento}" target="_blank" rel="noopener" class="btn" style="display:inline-block; margin-top:8px;">Ir para o pagamento</a>`;
      }

      conteudo.innerHTML = `
        <div class="page-head">
          <p class="eyebrow">Finalizar pedido</p>
          <h2 class="page-title">${saudacao}</h2>
          <p class="page-lede">Confira o resumo do seu pedido abaixo. Assim que o pagamento for confirmado, eu já sigo com a produção e te aviso o prazo de entrega.</p>
        </div>

        ${pedido.resumo ? `<div class="pedido-resumo">${pedido.resumo.replace(/</g, '&lt;')}</div>` : ''}
        ${pedido.valor ? `<p class="price">${formatarValor(pedido.valor)}</p>` : ''}

        ${qrHtml}
        ${acaoHtml}
      `;
    }

    carregarPedido();
  </script>
</body>
</html>
